<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 84" width="372" height="84" role="img" aria-label="retirements.in: Plan your second innings">
  <title>retirements.in: Plan your second innings</title>
  <defs>
    <!-- terracotta gullak (clay money pot) -->
    <linearGradient id="rtPotD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EE8466"/>
      <stop offset="1" stop-color="#C9573B"/>
    </linearGradient>
    <linearGradient id="rtCoinD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4D58A"/>
      <stop offset="1" stop-color="#E0B04A"/>
    </linearGradient>
  </defs>
  <g transform="translate(6 10)">
  <!-- soft ground shadow -->
  <ellipse cx="32" cy="60.5" rx="13" ry="2.2" fill="#264653" opacity=".18"/>
  <!-- pot body -->
  <path d="M32 21.5c-11.6 0-19.5 6.6-19.5 17.2C12.5 50.4 21 59 32 59s19.5-8.6 19.5-20.3c0-10.6-7.9-17.2-19.5-17.2z" fill="url(#rtPotD)"/>
  <!-- neck + rim -->
  <path d="M25.5 17.5h13l-1.2 5h-10.6z" fill="#D9603F"/>
  <rect x="22.5" y="14.5" width="19" height="4.4" rx="2.2" fill="#264653"/>
  <!-- coin slot -->
  <rect x="27.6" y="15.7" width="8.8" height="2" rx="1" fill="#F7F6F2" opacity=".9"/>
  <!-- rupee coin dropping in -->
  <circle cx="32" cy="7" r="5.6" fill="url(#rtCoinD)" stroke="#C9963A" stroke-width=".8"/>
  <path d="M29.6 4.6h4.8M29.6 6.3h4.8M30.4 4.6c2.6 0 2.6 3.4 0 3.4h-.8l3.2 3.4" fill="none" stroke="#7A5418" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rising growth arrow across the pot -->
  <path d="M19.5 46.5l7.2-6.2 5.2 3.9 10-9.6" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37.3 33.9l5.2-.7-.6 5.2" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rangoli dots -->
  <circle cx="24" cy="52.6" r="1.15" fill="#F4D58A"/>
  <circle cx="28" cy="54.2" r="1.15" fill="#F4D58A"/>
  <circle cx="32" cy="54.8" r="1.15" fill="#F4D58A"/>
  <circle cx="36" cy="54.2" r="1.15" fill="#F4D58A"/>
  <circle cx="40" cy="52.6" r="1.15" fill="#F4D58A"/>
  </g>
  <text x="84" y="47" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-1" fill="#E6EDEF">retirements<tspan fill="#3FB8A9">.in</tspan></text>
  <text x="86" y="69" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" letter-spacing="2.6" fill="#93A5AF">PLAN YOUR SECOND INNINGS</text>
</svg>
